<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tcrg - ton's cog rythm-ish game</title>
	<link rel="stylesheet" href="CSS/style.css" />
</head>

<body>
	<div class = "starting-screen screen">
		<h1 class = "title">T C R G !</h1>

		<button class = "start-btn">START</button>
	</div>

	<div class = "menu-screen screen">

		<!-- GOD the CSS here as of writting this looks HORRIDDDDD but i can look into that another day, MVP matters more ;w; -->

		<h1>This is some SUPER EPIC placeholder text for the menu waahoo superrrrrrrrrrrr marioooooooo YYAAAAAAAAHOOOOOOOOOOOOOOOOOOO!!!!!!</h1>

		<span class = "high-score">HS: <span class = "high-score-val">0</span> </span>
		
		<ul class = "speed">
			<li>Speed:</li>
			<li class = "speed-opt">1x</li>
			<li class = "speed-opt">2x</li>
			<li class = "speed-opt">3x</li>
		</ul>

		<ul class = "difficulty">
			<li class = "diff-opt">5x - Easy</li>
			<li class = "diff-opt">3x - Normal</li>
			<li class = "diff-opt">1x - Hard</li>
		</ul>

		<button class = "start-game-btn">START THE GAME</button>
		<button class = "return-start-btn">RETURN TO START SCREEN</button>
	</div>

	<div class = "game-screen screen">
		<!-- I need to make actual drawings for these later,, as for pretty much everything else UI wise in the game but i think these and the buttons are prob the quickest to make me thinks -->
		<span class = "HP">[♥]: <span class="HP-val">1</span> </span>
		<span class = "time">[⧖]: <span class="time-val">0</span> </span>
		<span class = "score">[S]: <span class="score-val">0</span> </span>
		<span class = "combo">[C]: <span class="combo-val">0</span> </span>
	</div>

	<div class = "death-screen screen">
		<h1>You lost !!!</h1>

		<span class = "ds-score">Final score: <span class = "ds-score-val">0</span> </span>
		<span class = "ds-hcombo">Highest combo:<span class = "ds-hcombo-val">0</span> </span>

		<button class = "restart-game-btn">PLAY AGAIN</button>
		<button class = "return-menu-btn">RETURN TO THE MENU</button>
	</div>

	<script src="JS/main.js"></script>
	<script src="JS/gamelogic.js"></script>
	<script src="JS/menulogic.js"></script>
	<script src="JS/player.js"></script>
	<script src="JS/notes.js"></script>
</body>

</html>
