<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tcrg - ton's cog rythm-ish game</title>
	<link rel="stylesheet" href="CSS/style.css" />
</head>

<body>
	<div class = "starting-screen screen">
		<h1 class = "title">
			<img src="Assets/Imgs/Menus/tcrglogo.png" alt="TCRG's logo">
		</h1>

		<button class = "start-btn button">
			<img src="Assets/Imgs/Buttons/menustart.png" alt="Start button">
		</button>
	</div>

	<div class = "menu-screen screen">
		<div class = "menu-screen-ton">
			<img class ="hud-menu-screen" src="Assets/Imgs/Menus/menuton.png" alt="highscore">
		</div>

		<div class = "menu-screen-options">
			<span class = "high-score">
				<img class ="hud-menu-screen" src="Assets/Imgs/HUD/hudhighscore.png" alt="highscore">
				<span class = "high-score-val">0</span> 
			</span>
		
			<ul class = "speed">
					<img class ="hud-menu-screen" src="Assets/Imgs/HUD/hudspeed.png" alt="speed icon thingy">
				<li>Speed: </li>
				<li class = "speed-opt">1x</li>
				<li class = "speed-opt">2x</li>
				<li class = "speed-opt">3x</li>
			</ul>

			<ul class = "difficulty">
					<img class ="hud-menu-screen" src="Assets/Imgs/HUD/hudhp.png" alt="difficulty icon thingy">
				<li>Difficulty: </li>
				<li class = "diff-opt">5x (Easy)</li>
				<li class = "diff-opt">3x (Normal)</li>
				<li class = "diff-opt">1x (Hard)</li>
			</ul>
		
			<div class = "menu-screen-buttons">
				<button class = "start-game-btn button">
					<img src="Assets/Imgs/Buttons/menustartgame.png" alt="Game starting button">
				</button>
		
				<button class = "return-start-btn button">
					<img src="Assets/Imgs/Buttons/menureturnstart.png" alt="Return to starting screen button">
				</button>
			</div>
		</div>
	</div>

	<div class = "game-screen screen">
		<hr class = "lane-thingy">

		<div class="left-hud-game-screen">
			<span class = "HP">
				<img class ="hud-game-screen" src="Assets/Imgs/HUD/hudhp.png" alt="HP">
				<span class="HP-val">1</span> 
			</span>
			<span class = "time ">
				<img class ="hud-game-screen" src="Assets/Imgs/HUD/hudtimer.png" alt="time"> 	
				<span class="time-val">0</span> 
			</span>
		</div>

		<div class="right-hud-game-screen">
			<span class = "combo">
				<img class ="hud-game-screen" src="Assets/Imgs/HUD/hudcombo.png" alt="combo"> 
				<span class="combo-val">0</span> 
			</span>
			<span class = "score">
				<img class ="hud-game-screen" src="Assets/Imgs/HUD/hudscore.png" alt="score"> 
				<span class="score-val">0</span> 
			</span>
		</div>
	</div>

	<div class = "death-screen screen">

		<div class = "death-screen-overall">
			<h1 class = "death-screen-title">You lost !!!</h1>
		
			<div class = "death-screen-hud">
				<span class = "ds-score">
					<img class ="hud-death-screen" src="Assets/Imgs/HUD/hudfinalscore.png" alt="final score">
					<span class = "ds-score-val">0</span> 
				</span>
				<span class = "ds-hcombo">
					<img class ="hud-death-screen" src="Assets/Imgs/HUD/hudhighestcombo.png" alt="highest combo">
					<span class = "ds-hcombo-val">0</span> 
				</span>
			</div>

			<div class = "death-screen-options">
				<button class = "restart-game-btn button">
					<img src="Assets/Imgs/Buttons/menurestartgame.png" alt="Game restarting button">
				</button>

				<button class = "return-menu-btn button">
					<img src="Assets/Imgs/Buttons/menureturnmenu.png" alt="Return to menu screen button">
				</button>
			</div>
		</div>
	
	<script src="JS/main.js"></script>
	<script src="JS/gamelogic.js"></script>
	<script src="JS/menulogic.js"></script>
	<script src="JS/player.js"></script>
	<script src="JS/notes.js"></script>
</body>

</html>
