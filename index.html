<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tcrg - ton's cog rythm-ish game</title>
	<link rel="stylesheet" href="CSS/style.css" />
</head>

<body>
	<div class = "starting-screen screen">
		<h1 class = "title">
			<img src="Imgs/Menus/tcrglogo.png" alt="TCRG's logo">
		</h1>

		<button class = "start-btn button">
			<img src="Imgs/Buttons/menustart.png" alt="Start button">
		</button>
	</div>

	<div class = "menu-screen screen">
		<span class = "high-score">HS: <span class = "high-score-val">0</span> </span>
		
		<ul class = "speed">
			<li>Speed:</li>
			<li class = "speed-opt">1x</li>
			<li class = "speed-opt">2x</li>
			<li class = "speed-opt">3x</li>
		</ul>

		<ul class = "difficulty">
			<li class = "diff-opt">5x - Easy</li>
			<li class = "diff-opt">3x - Normal</li>
			<li class = "diff-opt">1x - Hard</li>
		</ul>

		<button class = "start-game-btn button">
			<img src="Imgs/Buttons/menustartgame.png" alt="Game starting button">
		</button>
		
		<button class = "return-start-btn button">
			<img src="Imgs/Buttons/menureturnstart.png" alt="Return to starting screen button">
		</button>
	</div>

	<div class = "game-screen screen">
		<hr class = "lane-thingy">

		<div class="left-hud-game-screen">
			<span class = "HP">
				<img class ="hud-game-screen" src="Imgs/HUD/hudhp.png" alt="HP">
				<span class="HP-val">1</span> 
			</span>
			<span class = "time ">
				<img class ="hud-game-screen" src="Imgs/HUD/hudtimer.png" alt="time"> 	
				<span class="time-val">0</span> 
			</span>
		</div>

		<div class="right-hud-game-screen">
			<span class = "combo">
				<img class ="hud-game-screen" src="Imgs/HUD/hudcombo.png" alt="combo"> 
				<span class="combo-val">0</span> 
			</span>
			<span class = "score">
				<img class ="hud-game-screen" src="Imgs/HUD/hudscore.png" alt="score"> 
				<span class="score-val">0</span> 
			</span>
		</div>
	</div>

	<div class = "death-screen screen">
		<h1>You lost !!!</h1>

		<span class = "ds-score">Final score: <span class = "ds-score-val">0</span> </span>
		<span class = "ds-hcombo">Highest combo:<span class = "ds-hcombo-val">0</span> </span>

		<button class = "restart-game-btn button">
			<img src="Imgs/Buttons/menurestartgame.png" alt="Game restarting button">
		</button>

		<button class = "return-menu-btn button">
			<img src="Imgs/Buttons/menureturnmenu.png" alt="Return to menu screen button">
		</button>
	</div>

	<script src="JS/main.js"></script>
	<script src="JS/gamelogic.js"></script>
	<script src="JS/menulogic.js"></script>
	<script src="JS/player.js"></script>
	<script src="JS/notes.js"></script>
</body>

</html>
